-- macOS-style Conky: minimal translucent system widget, top-right.
-- @FONT@ and @IFACE@ are substituted by 07-conky.sh at install time.

conky.config = {
    -- placement ---------------------------------------------------------
    alignment = 'top_right',
    gap_x = 46,
    gap_y = 56,
    minimum_width = 230, maximum_width = 230,

    -- window (transparent, pinned below windows, no taskbar entry) -------
    own_window = true,
    own_window_type = 'normal',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_class = 'Conky',
    own_window_title = 'macos-conky',

    -- rendering ---------------------------------------------------------
    double_buffer = true,
    draw_shades = true,            -- subtle shadow = readable on any wallpaper
    default_shade_color = '000000',
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,

    -- behaviour ---------------------------------------------------------
    update_interval = 1.0,
    no_buffers = true,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    override_utf8_locale = true,

    -- text --------------------------------------------------------------
    use_xft = true,
    font = '@FONT@:size=10',
    xftalpha = 1,
    default_color = 'FFFFFF',
}

conky.text = [[
${alignr}${font @FONT@:size=44}${time %H:%M}${font}
${alignr}${font @FONT@:size=13}${time %A, %d %B}${font}
${voffset 20}${alignr}${font @FONT@:size=9}${color AAAAAA}S Y S T E M${color}${font}
${alignr}${hr 1}
${alignr}${color DDDDDD}${nodename}${color}
${alignr}uptime  ${uptime_short}
${alignr}kernel  ${kernel}
${voffset 16}${alignr}${font @FONT@:size=9}${color AAAAAA}R E S O U R C E S${color}${font}
${alignr}${hr 1}
${alignr}CPU  ${cpu cpu0}%
${alignr}${cpubar cpu0 4,160}
${alignr}RAM  ${memperc}%   ${mem} / ${memmax}
${alignr}${membar 4,160}
${alignr}Disk  ${fs_used_perc /}%
${alignr}${fs_bar 4,160 /}
${voffset 16}${alignr}${font @FONT@:size=9}${color AAAAAA}N E T W O R K   (@IFACE@)${color}${font}
${alignr}${hr 1}
${alignr}down  ${downspeedf @IFACE@} KiB/s
${alignr}up  ${upspeedf @IFACE@} KiB/s
]]
